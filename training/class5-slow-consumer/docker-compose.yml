version: '3.8'

services:
  kafka:
    build:
      context: ../../
      dockerfile: kafka-docker/Dockerfile
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9101:9101"

  producer:
    build:
      context: ./producer
    depends_on:
      - kafka

  consumer-1:
    build:
      context: ./consumer
    ports:
      - "5001:5000"
    depends_on:
      - kafka

  consumer-2:
    build:
      context: ./consumer
    ports:
      - "5002:5000"
    depends_on:
      - kafka

  scraper:
    build:
      context: ../../scraper
    depends_on:
      - kafka
