# Prometheus JMX Exporter rules for Kafka.
#
# Deploy this file on the broker side — it is read by the jmx_prometheus_javaagent
# at startup and controls which JMX MBeans are published as Prometheus metrics.
#
# All metric names are lowercased (lowercaseOutputName: true) so they match the
# JMX_TARGET_PREFIXES in scraper/config.py exactly.
#
# Label names are also lowercased; label VALUES preserve the original casing
# (e.g. request="JoinGroup", topic="my-topic").

---
lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:

  # ── Throughput: per-topic BytesIn / BytesOut / MessagesIn / ReplicationBytesOut ──
  # Produces: kafka_server_brokertopicmetrics_<name>_oneminuterate{topic="..."}
  - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|ReplicationBytesOutPerSec), topic=(.+)><>OneMinuteRate"
    name: "kafka_server_brokertopicmetrics_$1_oneminuterate"
    labels:
      topic: "$2"
    type: GAUGE

  # ── Throughput: broker-level totals (no topic label) ──
  - pattern: "kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|BytesOutPerSec|MessagesInPerSec|ReplicationBytesOutPerSec)><>OneMinuteRate"
    name: "kafka_server_brokertopicmetrics_$1_oneminuterate"
    type: GAUGE

  # ── Request latency components (99th percentile + mean) ──
  # Produces: kafka_network_requestmetrics_<latency>_<stat>{request="..."}
  # Captures: ThrottleTimeMs, TotalTimeMs, LocalTimeMs, RemoteTimeMs,
  #           ResponseSendTimeMs, RequestQueueTimeMs, ResponseQueueTimeMs
  - pattern: "kafka.network<type=RequestMetrics, name=(ThrottleTimeMs|TotalTimeMs|LocalTimeMs|RemoteTimeMs|ResponseSendTimeMs|RequestQueueTimeMs|ResponseQueueTimeMs), request=(.+)><>(99thPercentile|Mean)"
    name: "kafka_network_requestmetrics_$1_$3"
    labels:
      request: "$2"
    type: GAUGE

  # ── Request rates (JoinGroup / SyncGroup → rebalance signal) ──
  # Produces: kafka_network_requestmetrics_requestspersec_oneminuterate{request="..."}
  - pattern: "kafka.network<type=RequestMetrics, name=RequestsPerSec, request=(.+)><>OneMinuteRate"
    name: "kafka_network_requestmetrics_requestspersec_oneminuterate"
    labels:
      request: "$1"
    type: GAUGE

  # ── Broker thread utilisation ──
  # Produces: kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent
  - pattern: "kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate"
    name: "kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent"
    type: GAUGE

  # Produces: kafka_network_socketserver_networkprocessoravgidlepercent
  - pattern: "kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent><>Value"
    name: "kafka_network_socketserver_networkprocessoravgidlepercent"
    type: GAUGE

  # ── Replication health ──
  # Produces: kafka_server_replicamanager_<name>
  - pattern: "kafka.server<type=ReplicaManager, name=(UnderReplicatedPartitions|UnderMinIsrPartitionCount|AtMinIsrPartitionCount)><>Value"
    name: "kafka_server_replicamanager_$1"
    type: GAUGE

  # Produces: kafka_server_replicafetchermanager_maxlag{client_id="..."}
  - pattern: "kafka.server<type=ReplicaFetcherManager, name=MaxLag, clientId=(.+)><>Value"
    name: "kafka_server_replicafetchermanager_maxlag"
    labels:
      client_id: "$1"
    type: GAUGE

  # ── Controller ──
  # Produces: kafka_controller_kafkacontroller_<name>
  - pattern: "kafka.controller<type=KafkaController, name=(OfflinePartitionsCount|ActiveControllerCount|PreferredReplicaImbalanceCount)><>Value"
    name: "kafka_controller_kafkacontroller_$1"
    type: GAUGE

  # ── Group Coordinator (rebalance state) ──
  # Produces: kafka_coordinator_group_groupmetadatamanager_<name>
  - pattern: "kafka.coordinator.group<type=GroupMetadataManager, name=(NumGroups|NumGroupsPreparingRebalance|NumGroupsCompletingRebalance|NumGroupsStable|NumGroupsDead|NumGroupsEmpty)><>Value"
    name: "kafka_coordinator_group_groupmetadatamanager_$1"
    type: GAUGE

  # ── Per-partition log positions (for skew detection) ──
  # Produces: kafka_log_log_<name>{topic="...", partition="..."}
  - pattern: "kafka.log<type=Log, name=(LogEndOffset|LogStartOffset|Size), topic=(.+), partition=(.+)><>Value"
    name: "kafka_log_log_$1"
    labels:
      topic: "$2"
      partition: "$3"
    type: GAUGE
