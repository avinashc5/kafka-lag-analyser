services:
  kafka:
    build:
      context: .
      dockerfile: kafka-docker/Dockerfile
    container_name: kafka
    ports:
      - "9092:9092"   # Kafka broker (Admin API + client connections)
      - "9093:9093"   # KRaft controller
      - "9101:9101"   # Prometheus JMX Exporter — scraper reads from here

  producer:
    build: ./producer
    container_name: producer
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka

  consumer:
    build: ./consumer
    container_name: consumer
    restart: on-failure
    volumes:
      - ./consumer:/app
      - ./data:/app/data
    depends_on:
      - kafka

  analyser:
    build:
      context: .
      dockerfile: analyser/Dockerfile
    container_name: analyser
    ports:
      - "8000:8000"
    environment:
      - ANALYSIS_INTERVAL_SECONDS=10
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - scraper

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    container_name: control
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    depends_on:
      - kafka

  scraper:
    build: ./scraper
    container_name: scraper
    volumes:
      - ./scraper:/app/scraper
      - ./data:/app/data
    depends_on:
      - kafka
