<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafka Lag Analyser Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 32px 40px;
      background: #f0f2f5;
      color: #222;
      line-height: 1.5;
    }
    h1 { margin: 0 0 4px; font-size: 1.7em; color: #111; }
    .subtitle { color: #666; margin: 0 0 28px; font-size: 0.95em; }
    h2 { margin: 0 0 16px; font-size: 1.1em; color: #333; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
    .card {
      background: white;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    /* Fault card */
    .fault-block {
      border-left: 4px solid #e53e3e;
      padding: 14px 16px;
      margin-bottom: 14px;
      background: #fff5f5;
      border-radius: 0 6px 6px 0;
    }
    .fault-block h3 { margin: 0 0 8px; font-size: 1em; color: #c53030; }
    .ok-block {
      border-left: 4px solid #38a169;
      padding: 14px 16px;
      background: #f0fff4;
      border-radius: 0 6px 6px 0;
      color: #276749;
      font-weight: 500;
    }
    /* Badge */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.78em;
      font-weight: 700;
      background: #2d3748;
      color: #fff;
      margin-right: 4px;
    }
    /* Importances table */
    .imp-table { width: 100%; border-collapse: collapse; font-size: 0.85em; margin-top: 6px; }
    .imp-table th { text-align: left; padding: 4px 8px; background: #edf2f7; color: #555; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
    .imp-table td { padding: 4px 8px; border-bottom: 1px solid #f0f0f0; font-family: monospace; }
    .imp-bar-cell { width: 160px; }
    .imp-bar-bg { background: #e2e8f0; border-radius: 3px; height: 10px; }
    .imp-bar-fill { height: 10px; border-radius: 3px; background: #e53e3e; }
    details summary { cursor: pointer; font-size: 0.88em; color: #3182ce; font-weight: 600; margin-top: 10px; }
    details summary:hover { text-decoration: underline; }
    /* History snapshot */
    .snapshot {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .snapshot:last-child { border-bottom: none; }
    .snapshot-time { font-size: 0.8em; color: #888; min-width: 170px; padding-top: 2px; }
    .snapshot-content { flex: 1; }
    .snap-fault-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      background: #fed7d7;
      color: #c53030;
      margin-right: 6px;
      margin-bottom: 4px;
    }
    .snap-ok-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8em;
      font-weight: 600;
      background: #c6f6d5;
      color: #276749;
    }
    /* Status indicator */
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .dot-green { background: #38a169; }
    .dot-red   { background: #e53e3e; animation: pulse 1.2s infinite; }
    .dot-grey  { background: #aaa; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .last-update { font-size: 0.8em; color: #888; }
    .error-block {
      border-left: 4px solid #dd6b20;
      padding: 14px 16px;
      background: #fffaf0;
      border-radius: 0 6px 6px 0;
      color: #7b341e;
    }
    a.control-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 18px;
      background: #3182ce;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9em;
      font-weight: 600;
    }
    a.control-link:hover { background: #2b6cb0; }
  </style>
</head>
<body>
  <h1>Kafka Lag Analyser</h1>
  <p class="subtitle">Live fault detection dashboard &mdash; refreshes every 5 seconds</p>

  <a class="control-link" href="http://localhost:8001" target="_blank">🎛️ Open Fault Injector (Control Panel)</a>

  <!-- Current faults -->
  <div class="card">
    <div class="header-row">
      <h2>Currently Active Faults</h2>
      <span class="last-update" id="last-update"></span>
    </div>
    <div id="status">Loading…</div>
  </div>

  <!-- Recent history -->
  <div class="card">
    <h2>Recent Fault History</h2>
    <div id="history-container">Loading…</div>
  </div>

  <script>
    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function fmtDateTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function buildImportancesTable(features, importances) {
      if (!importances || Object.keys(importances).length === 0) {
        return '<em style="color:#888;font-size:0.85em">No importance data</em>';
      }
      // Sort features by importance descending, show top 8
      const sorted = Object.entries(importances)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      const maxImp = sorted[0]?.[1] || 1;

      let rows = sorted.map(([feat, imp]) => {
        const val = features?.[feat];
        const valStr = val !== undefined ? Number(val).toFixed(4) : '—';
        const barW = Math.round((imp / maxImp) * 100);
        return `<tr>
          <td>${feat}</td>
          <td>${imp.toFixed(4)}</td>
          <td class="imp-bar-cell">
            <div class="imp-bar-bg">
              <div class="imp-bar-fill" style="width:${barW}%"></div>
            </div>
          </td>
          <td>${valStr}</td>
        </tr>`;
      }).join('');

      return `<table class="imp-table">
        <thead><tr>
          <th>Feature</th>
          <th>Importance</th>
          <th>Bar</th>
          <th>Observed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    const HIDDEN_FAULTS = new Set(['network_degradation']);

    function renderCurrentFaults(faults) {
      const div = document.getElementById('status');
      const visible = (faults || []).filter(f => !HIDDEN_FAULTS.has(f.fault_class));
      if (visible.length === 0) {
        div.innerHTML = '<div class="ok-block"><span class="status-dot dot-green"></span>Healthy — no active faults detected in the current cluster state.</div>';
        return;
      }
      div.innerHTML = visible.map(f => {
        const entityTags = Object.entries(f.entity || {})
          .map(([k, v]) => `<span class="badge">${k}: ${v}</span>`).join('');
        const impHtml = buildImportancesTable(f.features, f.importances);
        return `<div class="fault-block">
          <h3><span class="status-dot dot-red"></span>⚠ ${f.fault_class}</h3>
          <div style="margin-bottom:6px">${entityTags}</div>
          <small style="color:#888">Scrape ID: ${f.scrape_id} &nbsp;|&nbsp; Detected: ${fmtTime(f.detected_at)}</small>
          <details>
            <summary>Feature Importances &amp; Observed Values</summary>
            ${impHtml}
          </details>
        </div>`;
      }).join('');
    }

    function renderHistory(snapshots) {
      const div = document.getElementById('history-container');
      if (!snapshots || snapshots.length === 0) {
        div.innerHTML = '<em style="color:#888">No analysis history yet.</em>';
        return;
      }
      // Show newest first
      const sorted = [...snapshots].reverse();
      div.innerHTML = sorted.map(snap => {
        const faults = (snap.faults || []).filter(f => !HIDDEN_FAULTS.has(f.fault_class));
        let tagsHtml;
        if (faults.length === 0) {
          tagsHtml = '<span class="snap-ok-tag">✓ Healthy</span>';
        } else {
          tagsHtml = faults.map(f => {
            const entity = Object.values(f.entity || {}).join(', ');
            const label = entity ? `${f.fault_class} (${entity})` : f.fault_class;
            return `<span class="snap-fault-tag">⚠ ${label}</span>`;
          }).join('');
        }
        return `<div class="snapshot">
          <div class="snapshot-time">${fmtDateTime(snap.analyzed_at)}<br>
            <span style="font-size:0.85em;color:#aaa">scrape #${snap.scrape_id}</span>
          </div>
          <div class="snapshot-content">${tagsHtml}</div>
        </div>`;
      }).join('');
    }

    async function fetchFaults() {
      try {
        const res = await fetch('/api/faults');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderCurrentFaults(data.current);
        renderHistory(data.snapshots);

        document.getElementById('last-update').textContent =
          'Last updated: ' + new Date().toLocaleTimeString();
      } catch (e) {
        console.error('Error fetching faults', e);
        document.getElementById('status').innerHTML =
          '<div class="error-block"><strong>Error:</strong> Cannot connect to Analyser API. Retrying…</div>';
      }
    }

    setInterval(fetchFaults, 5000);
    fetchFaults();
  </script>
</body>
</html>
